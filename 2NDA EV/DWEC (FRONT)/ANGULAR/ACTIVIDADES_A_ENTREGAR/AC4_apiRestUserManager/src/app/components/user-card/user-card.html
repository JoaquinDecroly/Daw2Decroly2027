
<div class="card h-100 shadow-sm">
  <img
    [src]="usuario."
    class="card-img-top"
    alt="Imagen del videojuego"
    style="height: 220px; object-fit: cover;"
  >

  <div class="card-body d-flex flex-column">
    <h5 class="card-title fw-bold">
      {{ juego.nombre }}
    </h5>

    <p class="text-muted mb-2">
      {{ juego.plataforma }}
    </p>

    <p class="mb-2">
      <span class="badge bg-secondary">{{ juego.genero }}</span>
    </p>

    <h5 class="text-primary fw-bold mt-2">
      {{ juego.precio }} €
    </h5>

    <div class="d-flex gap-2 flex-wrap mt-auto pt-3">
      <button
        class="btn btn-outline-primary btn-sm"
        (click)="editar.emit(juego.id)"
      >
        <i class="bi bi-pencil"></i> Editar
      </button>

      <button
        class="btn btn-outline-danger btn-sm"
        (click)="eliminar.emit(juego.id)"
      >
        <i class="bi bi-trash"></i> Eliminar
      </button>

      <button
        class="btn btn-outline-warning btn-sm"
        (click)="favorito.emit(juego.id)"
      >
        <i class="bi bi-heart"></i>
        {{ juego.favorito ? 'Quitar favorito' : 'Favorito' }}
      </button>
    </div>
  </div>
</div>
