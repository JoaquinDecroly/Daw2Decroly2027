
<div class="col-12 col-md-6 col-lg-4">
  <div class="card h-100">

    @if (serie.image?.medium) {
      <img
        class="card-img-top"
        [src]="serie.image.medium"
        [alt]="serie.name"
      />
    }

    <div class="card-body">
      <h5 class="card-title">{{ serie.name }}</h5>

      <p class="card-text">
        Idioma: {{ serie.language }}
      </p>

      <p class="card-text">
        Estado: {{ serie.status }}
      </p>

      <p class="card-text">
        Géneros: {{ serie.genres.join(', ') }}
      </p>

      <span class="badge bg-success">
        {{ serie.premiered }}
      </span>

      <div class="mt-3 d-flex gap-2">
        <button
          type="button"
          class="btn btn-primary"
          (click)="editarSerie()">
          Editar
        </button>

        <button
          type="button"
          class="btn btn-danger"
          (click)="eliminarSerie()">
          Eliminar
        </button>
      </div>
    </div>

  </div>
</div>
