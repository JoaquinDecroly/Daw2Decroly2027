<!-- ----------------------TIENE LÍMITE DE USO DIARIO [50 solicitudes diarias (por defecto actualización cada día)]------------------------- -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="resources/images/agoodshop.png" type="image/png">
    <title>agoodshop</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="styles/style.css">
        </head>
    <body>
    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand"><strong>agoodshop</strong></a>
                <p class="navbar-text">
                    <span>Tienda</span>
                    <span>Accesorios</span>
                    <span>Soporte</span>
                </p>
                <button class="btn btn-light">Contactar</button>
            </div>
        </nav>
        <main class="container py-4">
            <section class="exercise-card py-4" aria-labelledby="titulo-ppt">
                <div class="row g-4">
                    <div class="col-12 col-lg-8">
                        <h2 id="titulo-ppt" class="h4 mb-4">Carrito compra</h2>
                        <div class="row g-2 border-bottom pb-2 mb-2 text-secondary small d-none d-md-flex">
                            <div class="col-md-5">Producto</div>
                            <div class="col-md-3 text-center">Cantidad</div>
                            <div class="col-md-2">Unidad</div>
                            <div class="col-md-2 text-end">Total</div>
                        </div>
                        <div id="productsList" class="list-group list-group-flush" aria-live="polite"></div>
                    </div>
                    <aside class="col-12 col-lg-4" aria-labelledby="total-title">
                        <div class="bg-light p-4">
                            <h3 id="total-title" class="h4 mb-3">Total</h3>
                            <ul id="listaCompra" class="list-unstyled mb-3"></ul>
                            <div class="d-flex justify-content-between border-top pt-3">
                                <span>TOTAL</span>
                                <strong id="cartTotal">0,00 €</strong>
                            </div>
                        </div>
                    </aside>
                </div>
            </section>
        </main>

        <footer class="text-center"><small>©<strong>agoodshop</strong></small></footer>
        
        <script src="scripts/carritoVista.js" defer></script>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
