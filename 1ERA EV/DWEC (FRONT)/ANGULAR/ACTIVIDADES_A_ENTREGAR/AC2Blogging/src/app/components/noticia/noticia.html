<article class="card h-100 shadow-sm">
  <img [src]="noticia.imagen" class="card-img-top object-fit-cover" style="height: 180px;" alt="Imagen de la noticia">
  <!-- <img src="https://picsum.photos/600/300" [src]="noticia.imagen" class="card-img-top object-fit-cover" style="height: 180px;" alt="Imagen de la noticia"> -->
  <div class="card-body">
    <h3 class="card-title h5">{{noticia.titulo}}</h3>
    <p class="card-text">{{noticia.texto}}</p>
  </div>
  <div class="card-footer bg-transparent">
    <small class="text-body-secondary">Publicado el {{noticia.fecha}}</small>
    <button type="button" class="btn btn-sm btn-outline-primary container-fluid mb-3 mt-2 text-center" (click)="editarNoticia()">Editar</button>
    <button type="button" class="btn btn-sm btn-outline-danger container-fluid col-9 border-danger-subtle position-relative text-center" (click)="borrar()">Eliminar</button>
  </div>
</article>
