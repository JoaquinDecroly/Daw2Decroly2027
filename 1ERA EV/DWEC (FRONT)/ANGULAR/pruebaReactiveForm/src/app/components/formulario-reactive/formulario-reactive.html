<form action="" [formGroup]="modelForm" class="card p3 shadow" (ngSubmit)="getData()">
    
    

    <div class="form-floating mb-3">
            <input
                type="text"
                class="form-control"
                name="nombre"
                id="nombre"
                placeholder=""
                formControlName="nombre"
            />
            <label for="nombre">Nombre</label>
        </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
            type="email"
            class="form-control"
            name="email"
            id="email"
            aria-describedby="emailHelpId"
            placeholder="abc@mail.com"
            formControlName="email"
        />
        <small id="emailHelpId" class="form-text text-body-secondary"
            >Help text</small
        >
    </div>

    <div class="form-floating mb-3">
            <input
                type="number"
                class="form-control"
                name="edad"
                id="edad"
                placeholder="50"
                formControlName="edad"
            />
            <label for="nombre">Nombre</label>
        </div>

    <div class="form-floating mb-3">
        <input
            type="text"
            class="form-control"
            name="dni"
            id="dni"
            placeholder=""
            formControlName="dni"
        />
        <label for="dni">DNI</label>
    </div>

  
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
            type="password"
            class="form-control"
            name="password"
            id="password"
            placeholder="********"
            formControlName="password"
        />
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
            type="password"
            class="form-control"
            name="password"
            id="password"
            placeholder="********"
            formControlName="repitePassword"
        />
    </div>
    
    <input type="submit" value="Enviar" class="container-fluid bg-gradient">
    
    
</form>
