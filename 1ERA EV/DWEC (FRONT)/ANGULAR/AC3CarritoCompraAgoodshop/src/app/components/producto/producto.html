<div class="row align-items-center g-2">
  <div class="col-12 col-md-5">
    <h3 class="h5 mb-1">{{producto().nombre}}</h3>
    <p class="text-secondary small mb-0">{{producto().sku}}</p>
  </div>

  <div class="col-6 col-md-3 d-flex justify-content-md-center">
    <div class="input-group input-group-sm">

      <button class="btn btn-outline-secondary" type="button" aria-label="Quitar una unidad"
        [disabled]="producto().unidades === 0 || producto().precio === null"
        (click)="cambioUnidades.emit(producto().unidades - 1)">
        -
      </button>

      <input class="form-control text-center" type="number" min="0" max="99" value="3" aria-label="Cantidad" 
        [value]="producto().unidades" 
        [disabled]="producto().precio === null" 
        (change)="cambiarUnidades($event)"/>

      <button class="btn btn-outline-secondary" type="button" aria-label="Añadir una unidad" 
        [disabled]="producto().precio === null || producto().unidades === 99">
        +
      </button>

    </div>
  </div>

  <div class="col-3 col-md-2 text-nowrap">{{producto().precio}} {{moneda()}}</div>
</div>
