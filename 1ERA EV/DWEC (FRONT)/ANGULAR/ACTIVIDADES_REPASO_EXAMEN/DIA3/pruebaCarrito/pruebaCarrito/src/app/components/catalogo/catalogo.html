
<div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="h4 fw-bold mb-1">Catálogo de productos</h2>
      <p class="text-body-secondary mb-0">Explora nuestros productos</p>
    </div>
    <span class="badge text-bg-primary">{{ productos.length }} productos</span>
  </div>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4">

    @for(producto of productos; track producto.id) {
      <div class="col">
        <app-producto-card
          [producto]="producto"
          (anadir)="anadirProducto($event)">
        </app-producto-card>
      </div>
    }

  </div>
</div>
