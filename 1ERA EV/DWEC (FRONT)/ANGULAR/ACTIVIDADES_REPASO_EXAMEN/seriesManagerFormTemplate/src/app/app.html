<section class="container">

  <div class="dropdown">
    <button
      class="btn btn-secondary dropdown-toggle"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false">
      Añadir / Editar serie
    </button>

    <div class="dropdown-menu p-3">
      <app-formulario
        [serieEditar]="serieSeleccionada">
      </app-formulario>
    </div>
  </div>

  <app-lista-series
    (editar)="editarSerie($event)">
  </app-lista-series>

</section>
