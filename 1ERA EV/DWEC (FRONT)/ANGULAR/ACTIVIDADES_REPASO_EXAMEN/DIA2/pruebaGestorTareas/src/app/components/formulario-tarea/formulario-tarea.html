<div class="card border-0 shadow-sm rounded-4">
  <div class="card-body p-4">
    <h2 class="fs-5 fw-semibold mb-4">Nueva tarea</h2>

    <form (ngSubmit)="guardarTarea()">
      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input type="text" class="form-control" [(ngModel)]="titulo"
        id="titulo" name="titulo" placeholder="Ej: Design new homepage" required>
      </div>

      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" [(ngModel)]="descripcion"
        name="descripcion" rows="3" placeholder="Describe la tarea"></textarea>
      </div>

      <div class="mb-3">
        <label for="estado" class="form-label">Estado</label>
        <select class="form-select" id="estado" [(ngModel)]="estado"
        name="estado" required>
          <option value="" selected disabled>Selecciona un estado</option>
          <option value="To Do">To Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-light" (click)="cancelarTarea()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
