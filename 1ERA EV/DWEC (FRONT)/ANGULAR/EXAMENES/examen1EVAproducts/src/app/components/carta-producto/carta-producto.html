
<div class="col-12 col-md-6 col-lg-4">
  <div class="card h-100">
    <span class="badge bg-success position-relative">
        {{ product.price }}
    </span>

    <img
        class="card-img-top"
        [src]="product.image"
        [alt]="product.name"
    />

    <div class="card-body">
      <h5 class="card-title">{{ product.name }}</h5>

      <p class="card-text">{{ product.description }}</p>

      <p class="card-text">
        {{ product.category }}
      </p>

      <p class="card-text">
        {{ product.active}}
      </p>

      <div class="mt-3 d-flex gap-2">
        
        <button
          type="button"
          class="btn btn-danger"
          (click)="eliminarProduct()">
          Eliminar
        </button>

        <button
          type="button"
          class="btn btn-danger"
          (click)="filtrarPorNombre()">
          Filtrar por Nombre
        </button>
        
        <button
          type="button"
          class="btn btn-danger"
          (click)="filtrarPorCategoria()">
          Filtrar por Categoria
        </button>

        <button
          type="button"
          class="btn btn-danger"
          (click)="filtrarPorPrecio()">
          Filtrar Por Precio
        </button>

        <button
          type="button"
          class="btn btn-danger"
          (click)="filtrarPorActivo()">
          Filtrar por Activo
        </button>
      </div>
    </div>

  </div>
</div>
