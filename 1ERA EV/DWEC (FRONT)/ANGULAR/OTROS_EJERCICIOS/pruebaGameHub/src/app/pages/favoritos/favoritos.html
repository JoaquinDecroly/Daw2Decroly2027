<div class="container py-4">

  <div class="mb-4">
    <h2 class="fw-bold">
      <i class="bi bi-heart-fill text-danger me-2"></i>
      Mis videojuegos favoritos
    </h2>
    <p class="text-muted">
      Aquí encontrarás todos tus videojuegos favoritos.
    </p>
  </div>

  <div class="row g-4">

    @for (juego of obtenerFavoritos(); track juego.id) {
      <div class="col-md-6 col-lg-4">
        <app-juego-card
          [juego]="juego"
          (favorito)="eliminarFavorito($event)"
          (eliminar)="eliminarJuego($event)"
          (editar)="editarJuego($event)"
        />
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-info text-center">
          Todavía no tienes videojuegos favoritos.
          <a routerLink="/juegos" class="alert-link">
            Explorar catálogo
          </a>
        </div>
      </div>
    }

  </div>
</div>
