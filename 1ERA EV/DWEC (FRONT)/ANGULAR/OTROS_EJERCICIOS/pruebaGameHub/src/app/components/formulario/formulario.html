
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white p-3">
        <h4 class="mb-0">
          {{ modoEdicion ? 'Editar videojuego' : 'Añadir videojuego' }}
        </h4>
      </div>

      <div class="card-body p-4">
        <form #formulario="ngForm" (ngSubmit)="guardarJuego(formulario)">

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input
              type="text"
              class="form-control"
              name="nombre"
              [(ngModel)]="nombre"
              required
              minlength="2"
              #nombreInput="ngModel"
            >
            @if (nombreInput.invalid && nombreInput.touched) {
              <div class="text-danger small">Introduce un nombre válido.</div>
            }
          </div>

          <div class="mb-3">
            <label class="form-label">Plataforma</label>
            <select
              class="form-select"
              name="plataforma"
              [(ngModel)]="plataforma"
              required
            >
              <option value="">Selecciona una plataforma</option>
              <option value="PC">PC</option>
              <option value="PlayStation">PlayStation</option>
              <option value="Xbox">Xbox</option>
              <option value="Nintendo Switch">Nintendo Switch</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Género</label>
            <select
              class="form-select"
              name="genero"
              [(ngModel)]="genero"
              required
            >
              <option value="">Selecciona un género</option>
              <option value="Acción">Acción</option>
              <option value="Aventura">Aventura</option>
              <option value="RPG">RPG</option>
              <option value="Deportes">Deportes</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Precio (€)</label>
            <input
              type="number"
              class="form-control"
              name="precio"
              [(ngModel)]="precio"
              required
              min="0"
            >
          </div>

          <div class="mb-3">
            <label class="form-label">URL de la imagen</label>
            <input
              type="url"
              class="form-control"
              name="imagen"
              [(ngModel)]="imagen"
              required
            >
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea
              class="form-control"
              rows="4"
              name="descripcion"
              [(ngModel)]="descripcion"
              required
              minlength="10"
            ></textarea>
          </div>

          <div class="form-check mb-4">
            <input
              class="form-check-input"
              type="checkbox"
              id="favorito"
              name="favorito"
              [(ngModel)]="favorito"
            >
            <label class="form-check-label" for="favorito">
              Añadir a favoritos
            </label>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button
              type="button"
              class="btn btn-secondary"
              routerLink="/juegos"
            >
              Cancelar
            </button>

            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="formulario.invalid"
            >
              {{ modoEdicion ? 'Actualizar videojuego' : 'Guardar videojuego' }}
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
