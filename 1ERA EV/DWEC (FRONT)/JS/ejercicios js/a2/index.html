<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <title>DWEC - DAW</title>
</head>
<body>
    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                <img src="/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                ENTRENAMIENTO JS 2
                </a>
            </div>
        </nav>
  </header>
  <main class="container exercise-page py-5" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; align-items: stretch;">
    
    <!-- ACTIVIDAD 1 [NOTAS] -->
    <section class="card exercise-card" aria-labelledby="titulo-notas">
      <div class="card-body p-4 p-sm-5">
        <p class="exercise-label mb-2">EJERCICIO 01</p>
        <h2 class="card-title h3 mb-2" id="titulo-notas" >Botón y párrafo</h2>
        <p class="text-secondary mb-4">Cuando cargue la página, aparecerá un párrafo y un botón</p>

          <div class="input-group mb-3">
            <p class="input-group-text hidden" id="text">Comprobando funcionamiento DOM</p>
            <button class="btn btn-primary w-100 hidden" id="btn">Botón cuando cargue DOM</button>
          </div>
      </div>
    </section>

    <!-- ACTIVIDAD 2 [HORA] -->
    <section class="card exercise-card" aria-labelledby="titulo-hora">
      <div class="card-body p-4 p-sm-5">
        <p class="exercise-label mb-2">EJERCICIO 02</p>
        <h2 class="card-title h3 mb-2" id="titulo-hora">Formulario</h2>
        <p class="text-secondary mb-4">Rellene un formulario con sus datos</p>

        <div class="bg-light rounded p-3 text-center">
          <span class="fw-semibold">Formulario:</span>
          <form id="formulario">
              <div class="input-group mb-2">
                <input class="form-control" id="nombre" type="text" placeholder="Inserte su nombre" required>
          </div>
              <div class="input-group mb-2">
                <input class="form-control" id="edad" type="number" min="1" max="99" step="1" placeholder="Inserte su edad" required>
          </div>
              <div class="input-group mb-2">
                <input class="form-control" id="email" type="text" placeholder="Inserte su email" required>
          </div>
              <div class="input-group mb-2">
                <input class="form-control" id="telefono" type="text" placeholder="Inserte su telefono" required>
          </div>
          <div class="input-group mb-2">
                <div class="form-check">
              <input class="form-check-input" type="checkbox" id="checkbox" required>
              <label class="form-check-label" for="checkbox">* Términos y condiciones </label>
                </div>
          </div>
              <div class="fs-4 mt-2">
            <button class="btn btn-primary w-100" id="formularioBtn" type="submit">Subir</button>
              </div>
        </form>
        </div>
      </div>
    </section>

    <!-- ACTIVIDAD 3 [PIEDRA, PAPEL, TIJERA] -->
    <section class="card exercise-card" aria-labelledby="titulo-ppt">
      <div class="card-body p-4 p-sm-5">
        <p class="exercise-label mb-2">EJERCICIO 03</p>
        <h2 class="card-title h3 mb-2" id="titulo-ppt">Fetch a API REST (JSONPlaceHolder)</h2>
        <p class="text-secondary mb-4"></p>
        <div class="d-grid gap-2">
          <button class="btn btn-outline-primary" type="button" id="users" onclick="fetchUsers()">Obtener fetch usuarios</button>
        </div>
        <div id="users-list" class="d-grid gap-2 mt-3" aria-live="polite"></div>
        <div id="gif">
          <!-- <img
            class="img-fluid rounded mt-3"
            src="resources/img/black%20and%20white%20illustration%20GIF%20by%20Laur%C3%A8ne%20Boglio.gif"
            alt="Ilustración animada de piedra, papel o tijera"
          > -->
        </div>
      </div>
    </section>
  </main>

    <script src="a2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
