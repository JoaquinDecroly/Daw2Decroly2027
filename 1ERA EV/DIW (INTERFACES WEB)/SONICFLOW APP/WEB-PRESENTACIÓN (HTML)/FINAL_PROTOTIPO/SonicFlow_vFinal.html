<div id="sf-boot" role="progressbar" aria-label="Cargando SonicFlow" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="sf-bg"></div>
  <div class="sf-exit"><div class="sf-inner">
    <div class="sf-logo">
      <div class="sf-halo" aria-hidden="true"><i></i></div>
      <svg class="sf-iso" viewBox="20 6 196 108" aria-hidden="true">
        <defs><linearGradient id="sfb-g" gradientUnits="userSpaceOnUse" x1="30" y1="12" x2="206" y2="108"><stop offset="0" stop-color="#67E8F9"/><stop offset=".45" stop-color="#38BDF8"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient></defs>
        <g fill="none" stroke="url(#sfb-g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
          <path class="p1" pathLength="100" d="M88 32 C82 22 72 18 62 18 C46 18 36 27 36 38 C36 50 47 55 62 59 C78 63 90 68 90 82 C90 95 78 102 62 102 C50 102 40 97 34 88"/>
          <path class="p2" pathLength="100" d="M114 102 V18 H158"/>
          <path class="p3" pathLength="100" d="M114 64 H124 L134 44 L147 88 L159 50 L167 64 H174"/>
        </g>
        <circle class="sf-dot" cx="198" cy="64" r="9" fill="url(#sfb-g)"/>
      </svg>
    </div>
    <div class="sf-meta"><span class="sf-label">SINTONIZANDO</span><span><b class="sf-num">000</b> / 100</span></div>
    <div class="sf-bar"><i></i></div>
  </div></div>
</div>
<script>

(function(){
"use strict";
var d=document,root=d.documentElement,boot=d.getElementById("sf-boot"),cv=d.getElementById("sf-synth");
if(!boot)return;
var now=function(){return performance.now()};
/* ---------- FASE 1 · progreso real por hitos ---------- */
var W={dom:.2,app:.3,load:.3,fonts:.2},ORDER=["dom","app","load","fonts"];
var MIN=2300,MAX=12000,t0=now(),lastMark=t0,lastFrame=t0,shown=-1,completed=false;
var B=window.__sfBoot={p:0,marks:{},loaded:false,revealed:false,done:false};
var num=boot.querySelector(".sf-num"),fill=boot.querySelector(".sf-bar i"),label=boot.querySelector(".sf-label");
var RM=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
root.classList.add("sf-booting");

B.mark=function(k){if(!(k in W)||B.marks[k]!=null)return;B.marks[k]=Math.round(now()-t0);lastMark=now();};
function real(){var s=0;for(var k in W)if(B.marks[k]!=null)s+=W[k];return s}
function all(){for(var k in W)if(B.marks[k]==null)return false;return true}
function nextW(){for(var i=0;i<ORDER.length;i++)if(B.marks[ORDER[i]]==null)return W[ORDER[i]];return 0}
function paint(p){var v=Math.min(100,Math.floor(p*100+1e-6));if(v!==shown){shown=v;num.textContent=(v<10?"00":v<100?"0":"")+v;boot.setAttribute("aria-valuenow",v)}fill.style.transform="scaleX("+p.toFixed(4)+")"}

/* hitos */
if(d.readyState!=="loading")B.mark("dom");else d.addEventListener("DOMContentLoaded",function(){B.mark("dom")});
function onLoad(){B.mark("load");var f=d.fonts&&d.fonts.ready;(f?f:Promise.resolve()).then(function(){B.mark("fonts")},function(){B.mark("fonts")});}
if(d.readyState==="complete")onLoad();else window.addEventListener("load",onLoad);
/* respaldo de «app montada» por si la app no llama a __sfBoot.mark("app") */
d.addEventListener("DOMContentLoaded",function(){var r=d.getElementById("root");if(!r)return;if(r.querySelector("main")){B.mark("app");return}
  if(window.MutationObserver){var mo=new MutationObserver(function(){if(r.querySelector("main")){B.mark("app");mo.disconnect()}});mo.observe(r,{childList:true,subtree:true})}});

function easeInOut(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function tick(){
  if(completed)return;
  var t=now(),dt=Math.min(.1,(t-lastFrame)/1000);lastFrame=t;
  var el=t-t0;
  if(el>MAX)for(var k in W)if(B.marks[k]==null)B.marks[k]="timeout";        /* salvavidas 12 s */
  var done=all();
  /* objetivo real: hitos cumplidos + avance suave hacia el siguiente (nunca lo alcanza) */
  var target=done?1:Math.min(.99,real()+nextW()*.85*(1-Math.exp(-(t-lastMark)/1400)));
  /* duración mínima: la curva temporal limita el avance para que se vea el dibujo */
  var gate=easeInOut(Math.min(1,el/MIN));
  if(!(done&&el>=MIN))target=Math.min(target,gate,.99);
  B.p=Math.max(B.p,B.p+(target-B.p)*Math.min(1,dt*6));
  if(!(done&&el>=MIN))B.p=Math.min(B.p,.99);
  if(done&&el>=MIN&&B.p>.993){B.p=1;paint(1);complete();return}
  paint(B.p);schedule();
}
var pending=false;function schedule(){if(pending)return;pending=true;requestAnimationFrame(function(){pending=false;tick()})}
schedule();
/* si la pestaña está oculta, rAF se congela: un temporizador mantiene vivo el salvavidas */
var keep=setInterval(function(){if(completed){clearInterval(keep);return}if(d.hidden&&now()-lastFrame>250){pending=false;tick()}},250);

function complete(){
  if(completed)return;completed=true;B.loaded=true;
  boot.classList.add("is-done");label.textContent="EN EL AIRE ◉";
  window.dispatchEvent(new CustomEvent("sf:loaded",{detail:{marks:B.marks,ms:Math.round(now()-t0)}}));
}

/* ---------- utilidades de animación ---------- */
var E={
  p2o:function(x){return 1-Math.pow(1-x,3)},
  p3o:function(x){return 1-Math.pow(1-x,4)},
  p2io:function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
  sio:function(x){return-(Math.cos(Math.PI*x)-1)/2}
};
function seg(t,start,dur,ease){var x=(t-start)/dur;x=x<0?0:x>1?1:x;return ease?ease(x):x}
function lerp(a,b,x){return a+(b-a)*x}

/* bloqueo de scroll mientras dura el arranque (la web usa Lenis sobre window) */
function block(e){if(boot.isConnected){e.preventDefault();e.stopImmediatePropagation()}}
var KEYS={32:1,33:1,34:1,35:1,36:1,38:1,40:1};
window.addEventListener("wheel",block,{capture:true,passive:false});
window.addEventListener("touchmove",block,{capture:true,passive:false});
window.addEventListener("keydown",function(e){if(KEYS[e.keyCode])block(e)},true);

/* ---------- FASE 2 + FASE 3 · se disparan SOLO con sf:loaded ---------- */
window.addEventListener("sf:loaded",outro,{once:true});

function finish(main){
  if(B.done)return;B.done=true;
  boot.remove();cv&&cv.remove();
  if(main){main.style.transform="";main.style.filter="";main.style.transformOrigin="";main.style.willChange=""}
  root.classList.remove("sf-booting");
  window.dispatchEvent(new Event("sf:bootend"));
}
function reveal(){if(B.revealed)return;B.revealed=true;window.dispatchEvent(new Event("sf:reveal"))}

function outro(){
  var main=d.querySelector("main");
  if(RM){ /* movimiento reducido: fundido simple, sin canvas */
    reveal();boot.style.transition="opacity .45s ease";boot.style.opacity="0";
    setTimeout(function(){finish(main)},500);return;
  }
  var logo=boot.querySelector(".sf-logo"),exit=boot.querySelector(".sf-exit"),bg=boot.querySelector(".sf-bg");
  var H=window.innerHeight||d.documentElement.clientHeight,Wd=window.innerWidth||d.documentElement.clientWidth;
  var draw=setupCanvas(Wd,H);
  if(main){main.style.willChange="transform,filter";main.style.transformOrigin="50% "+((window.scrollY||0)+H/2)+"px";
    main.style.transform="scale(1.045)";main.style.filter="blur(16px) saturate(150%) brightness(.7)"}
  var start=now(),END=2.75;
  function frame(){
    var t=(now()-start)/1000;
    /* FASE 2 */
    var punch=seg(t,0,.35,E.p2o);                                   /* 0,00 s golpe 1→1,07 */
    var ex=seg(t,.40,.70,E.p2io);                                   /* 0,40 s salida del bloque */
    logo.style.transform="scale("+lerp(1,1.07,punch).toFixed(4)+")";
    exit.style.opacity=(1-ex).toFixed(3);
    exit.style.filter="blur("+(10*ex).toFixed(2)+"px)";
    exit.style.transform="scale("+lerp(1,1.04,ex).toFixed(4)+")";
    bg.style.opacity=(1-seg(t,.50,.55,E.sio)).toFixed(3);             /* 0,50 s fundido del fondo */
    if(t>=.40){boot.style.pointerEvents="none";reveal()}
    /* FASE 3 */
    if(draw)draw(seg(t,.40,2.1,E.p2io));                            /* onda de sintetización */
    if(main){var m=seg(t,.40,2.3,E.p3o);                             /* web: 1,045→1 y filtro limpio */
      main.style.transform="scale("+lerp(1.045,1,m).toFixed(5)+")";
      main.style.filter=m>=1?"none":"blur("+lerp(16,0,m).toFixed(2)+"px) saturate("+lerp(150,100,m).toFixed(1)+"%) brightness("+lerp(.7,1,m).toFixed(3)+")"}
    if(t>=END){finish(main);return}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- canvas de sintetización ---------- */
function setupCanvas(Wd,H){
  if(!cv||!cv.getContext||!Wd||!H)return null;
  var ctx=cv.getContext("2d");if(!ctx)return null;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(Wd*dpr);cv.height=Math.round(H*dpr);cv.style.width=Wd+"px";cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var S=Math.max(Wd<700?11:14,Math.sqrt(Wd*H/30000));               /* tope ~30 000 círculos en pantallas enormes */
  var R0=S*.74;                                                     /* > S·√2/2 → sin huecos */
  var cx=Wd/2,cy=H/2,cols=Math.ceil(Wd/S)+1,rows=Math.ceil(H/S)+1;
  var P=new Float32Array(cols*rows*3),k=0,maxD=0;
  for(var j=0;j<rows;j++)for(var q=0;q<cols;q++){
    var x=q*S,y=j*S,a=Math.atan2(y-cy,x-cx);
    var dd=Math.hypot(x-cx,y-cy)+Math.sin(a*5+1.3)*S*1.6+Math.sin(a*11+.4)*S*.7+Math.sin(a*3-2)*S*1.1+(Math.random()-.5)*S*2.4;
    P[k++]=x;P[k++]=y;P[k++]=dd;if(dd>maxD)maxD=dd;
  }
  var band=Math.max(150,Math.hypot(cx,cy)*.28),R_FROM=-S*2,R_TO=maxD+band+S*2,TAU=Math.PI*2;
  var COL=["#7DEBFB","#38BDF8","#0EA5E9","#0369A1"],ALPHA=[.9,.7,.48,.28],bk=[[],[],[],[]];
  function draw(e){
    var R=lerp(R_FROM,R_TO,e),m,n;
    ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
    ctx.clearRect(0,0,Wd,H);
    for(m=0;m<4;m++)bk[m].length=0;
    ctx.fillStyle="#03070B";ctx.beginPath();
    for(m=0;m<P.length;m+=3){
      var x=P[m],y=P[m+1],u=(R-P[m+2])/band;
      if(u<=0){ctx.moveTo(x+R0,y);ctx.arc(x,y,R0,0,TAU)}             /* aún no alcanzado: círculo oscuro entero */
      else if(u<1){var g=1-u,r=R0*g*g;                                /* alcanzado: encoge y se tiñe */
        if(r>.3)bk[Math.min(3,(u*4)|0)].push(x,y,r)}
    }
    ctx.fill();
    for(m=0;m<4;m++){var A=bk[m];if(!A.length)continue;
      ctx.globalAlpha=ALPHA[m];ctx.fillStyle=COL[m];ctx.beginPath();
      for(n=0;n<A.length;n+=3){ctx.moveTo(A[n]+A[n+2],A[n+1]);ctx.arc(A[n],A[n+1],A[n+2],0,TAU)}
      ctx.fill()}
    ctx.globalAlpha=1;
    if(R>0&&R<R_TO){                                                  /* resplandor del frente, mezcla aditiva */
      var gIn=Math.max(0,R-band*.35),gOut=R+band*.3,gr=ctx.createRadialGradient(cx,cy,gIn,cx,cy,gOut);
      gr.addColorStop(0,"rgba(56,189,248,0)");gr.addColorStop(.6,"rgba(56,189,248,.2)");gr.addColorStop(1,"rgba(56,189,248,0)");
      ctx.globalCompositeOperation="lighter";ctx.fillStyle=gr;ctx.fillRect(0,0,Wd,H);ctx.globalCompositeOperation="source-over"}
  }
  draw(0);
  return draw;
}
})();

</script>
<div id="root"></div>

</body></html>
